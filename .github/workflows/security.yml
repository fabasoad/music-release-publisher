---
name: Security

on: # yamllint disable-line rule:truthy
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      security-type:
        description: What Security scanning you would like to run?
        required: false
        default: "all"
        type: choice
        options: ["all", "sca", "sast-actions", "sast-go"]

jobs:
  sast-go:
    name: SAST Go
    uses: fabasoad/reusable-workflows/.github/workflows/wf-security-sast.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      code-scanning-languages: "go"
      code-scanning-build-mode: "autobuild"
      code-scanning: ${{ contains(fromJSON('["all", "sast-go"]'), github.event.inputs.security-type || 'all') }}
      sca: ${{ contains(fromJSON('["all", "sca"]'), github.event.inputs.security-type || 'all') }}
      ghas-category: "go"

  sast-actions:
    name: SAST Actions
    uses: fabasoad/reusable-workflows/.github/workflows/wf-security-sast.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      code-scanning-languages: "actions"
      code-scanning-build-mode: "none"
      code-scanning: ${{ contains(fromJSON('["all", "sast-actions"]'), github.event.inputs.security-type || 'all') }}
      dependency-review: false
      ghas-category: "actions"
